<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bača Groove Orchestra</title>
<meta name="description" content="Poslouchej Bača Groove Orchestra na své oblíbené platformě.">
<meta property="og:title" content="Bača Groove Orchestra"><meta property="og:type" content="website">
<meta property="og:image" content="https://listen.bacagroove.com/bio/logo.png"><meta property="og:url" content="https://listen.bacagroove.com/bio/">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1a1a1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px;background:transparent}
.bg{position:fixed;inset:0;background:url(cover.jpg) center/cover;filter:blur(28px) brightness(.6) saturate(1.1);transform:scale(1.25);z-index:-1}
main{width:100%;max-width:440px;background:#222;border-radius:16px;overflow:hidden;padding-bottom:4px;box-shadow:0 10px 50px rgba(0,0,0,.55)}
.cover{display:block;width:100%;height:min(calc(100vw - 32px),440px,42vh);object-fit:cover;object-position:center 35%}
.info{padding:18px 20px 4px;text-align:center}
h1{font-size:24px;font-weight:700;line-height:1.2}
.by{margin-top:8px;font-size:15px;color:#ddd}
.list{padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid #444;border-radius:14px;color:#fff;text-decoration:none;transition:background .15s}
.row:hover,.row:focus{background:#2c2c2c}
.name{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.ico{width:28px;height:28px;flex:none}
.logo{display:block;height:30px;width:auto;max-width:170px}
.logo-spotify{height:34px}
.logo-ytmusic{height:28px}
.logo-youtube{height:24px}
.logo-apple{height:26px;filter:invert(1)}
.play{display:flex;align-items:center;gap:8px;flex:none;font-size:13px;font-weight:600;letter-spacing:.04em;border:1px solid #888;border-radius:8px;padding:9px 12px;white-space:nowrap}
.tri{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.name{min-width:0}.logo{flex:0 1 auto;min-width:0;object-fit:contain;object-position:left center}
.row{gap:12px}
@media(max-width:400px){.row{padding:13px 12px}.play{font-size:12px;letter-spacing:.02em;padding:9px 9px;gap:6px}.tri{border-left-width:10px;border-top-width:6px;border-bottom-width:6px}}
@media(max-width:340px){.play{font-size:11px;padding:8px 7px}.list{padding-left:10px;padding-right:10px}}
.social{display:flex;justify-content:center;gap:26px;padding:20px 0 10px}
.social a{color:#999;font-size:13px;text-decoration:none;display:flex}
.social svg{width:24px;height:24px;fill:#8a8a8a}
.social a:hover svg{fill:#fff}
footer{text-align:center;padding:4px 0 18px;font-size:12px;color:#8a8a8a}
footer a{color:#8a8a8a;text-decoration:none}
footer a:hover{color:#fff}
footer button{background:none;border:0;color:#777;text-decoration:underline;cursor:pointer;font-size:11px}
#cc{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;padding:12px;z-index:9}
#cc .box{max-width:440px;width:100%;background:#fff;color:#222;border-radius:14px;padding:10px 14px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 30px rgba(0,0,0,.5)}
#cc .btns{display:flex;gap:10px;margin-top:8px}
#cc button{flex:1;padding:8px;border-radius:9px;border:1px solid #222;font-weight:600;font-size:14px;cursor:pointer;background:#fff;color:#222}
#cc button.ok{background:#222;color:#fff}
.bg{background:radial-gradient(ellipse at top,#344334,#151515 75%);filter:none;transform:none}.brand{display:block;width:200px;max-width:70%;height:94px;object-fit:contain;margin:24px auto 0}.info{padding-top:16px}.by{margin-top:10px}.list{padding-top:22px;padding-bottom:24px}.row{min-height:64px}a:focus-visible{outline:3px solid #1ed760;outline-offset:3px}</style></head>
<body><div class="bg"></div>
<main>
<img class="brand" src="logo.png" alt="" width="160" height="160">
<div class="info"><h1>Bača Groove Orchestra</h1><p class="by">Poslouchej BGO</p></div>
<div class="list">

<a class="row" data-p="apple" data-a="intent://music.apple.com/cz/artist/ba%C4%8Da-groove-orchestra/1782679104#Intent;scheme=https;package=com.apple.android.music;end" href="https://music.apple.com/cz/artist/ba%C4%8Da-groove-orchestra/1782679104" rel="noopener"><span class="name"><img class="logo logo-apple" src="/assets/logos/apple.svg" alt="Apple Music"></span><span class="play"><span class="pt" data-en="LISTEN">POSLOUCHAT</span><i class="tri" aria-hidden="true"></i></span></a>
</div>

<footer>Powered by <a href="https://bacagroove.com/" rel="noopener">Bača Groove Orchestra</a></footer>
</main>

</script>
</body></html>
